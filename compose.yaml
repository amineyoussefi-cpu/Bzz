services:
  godot:
    build:
      context: .
      target: godot
      args:
        GODOT_VERSION: ${GODOT_VERSION:-4.7.2}
    environment:
      GODOT_PORT: ${GODOT_PORT:-9876}
      WORLD_WIDTH: ${WORLD_WIDTH:-}
      WORLD_HEIGHT: ${WORLD_HEIGHT:-}
    # no published port: Godot is only reachable inside the compose network
    # the "quit"/"restart" commands stop Godot; compose brings it back
    restart: unless-stopped

  backend:
    build:
      context: .
      target: backend
      args:
        GODOT_VERSION: ${GODOT_VERSION:-4.7.2}
    environment:
      GODOT_HOST: godot
      GODOT_PORT: ${GODOT_PORT:-9876}
      GODOT_TIMEOUT: ${GODOT_TIMEOUT:-10}
      BZZ_HTTP_HOST: 0.0.0.0
      # the OpenJev decision service runs on the host (Docker on Mac has no GPU access), not in a container
      DECISION_SERVICE_URL: ${DECISION_SERVICE_URL_FROM_DOCKER:-http://host.docker.internal:8009}
      DECISION_INTERVAL_TICKS: ${DECISION_INTERVAL_TICKS:-120}
      DECISION_CONCURRENCY: ${DECISION_CONCURRENCY:-2}
      DECISION_MAX_CANDIDATES: ${DECISION_MAX_CANDIDATES:-12}
      DECISION_TIMEOUT: ${DECISION_TIMEOUT:-30}
    extra_hosts:
      - "host.docker.internal:host-gateway"  # needed on Linux; Docker Desktop (Mac/Windows) provides it already
    depends_on:
      - godot
    # dashboard on http://localhost:${DASHBOARD_PORT}; bound to the host's loopback since there is no authentication
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8000}:8000"
    restart: unless-stopped
    # stdin entry point instead: docker compose run --rm backend python -m bzz
    stdin_open: true
