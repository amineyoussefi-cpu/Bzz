services:
  godot:
    build:
      context: .
      target: godot
      args:
        GODOT_VERSION: ${GODOT_VERSION:-4.7.2}
    environment:
      GODOT_PORT: ${GODOT_PORT:-9876}
    # the "quit"/"restart" commands stop Godot; compose brings it back
    restart: unless-stopped

  backend:
    build:
      context: .
      target: backend
      args:
        GODOT_VERSION: ${GODOT_VERSION:-4.7.2}
    environment:
      GODOT_HOST: godot
      GODOT_PORT: ${GODOT_PORT:-9876}
      GODOT_TIMEOUT: ${GODOT_TIMEOUT:-10}
    depends_on:
      - godot
    # commands are read from stdin: `docker compose run --rm backend`
    stdin_open: true
